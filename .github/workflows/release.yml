name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Optional ref to build instead of the selected branch, for example refs/pull/123/merge"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.0
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_ref || github.ref }}

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt

      - name: Use Rust toolchain
        run: rustup override set "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    needs:
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Use Rust toolchain
        run: rustup override set "$RUST_TOOLCHAIN"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release binary
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/mdstream-${{ matrix.name }}.tar.gz" mdstream

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdstream-${{ matrix.name }}
          path: dist/mdstream-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: mdstream-*
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
